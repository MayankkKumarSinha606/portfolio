<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title th:text="'My Portfolio - ' +${title}"></title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/images/favicon.ico}" />
    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link rel="stylesheet" th:href="@{/assets/css/styles.css}" />
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
    <!-- Navigation-->
    <div th:replace = "~{menu :: menu}"> </div>
<!--  Home  -->
    <div th:if="${title == 'Home'}"></div>
    <div th:replace = "~@{home::home}"></div>
<!--  Contact  -->
    <div th:if="${title == 'Contact'}"></div>
    <div th:replace = "~@{contact::contact}"></div>
<!--  Resume  -->
    <div th:if="${title == 'Resume'}"></div>
    <div th:replace = "~@{resume::resume}"></div>
<!--  Projects  -->
    <div th:if="${title == 'Projects'}"></div>
    <div th:replace = "~@{projects::projects}"></div>
</main>
<!-- Footer-->
<div th:replace = "~{footer :: footer}"> </div>
<!-- Bootstrap core JS-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Core theme JS-->
<script th:src="@{/assets/js/scripts.js}"></script>
</body>
</html>
